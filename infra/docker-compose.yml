services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: puzzlehub_dev
      POSTGRES_USER: puzzlehub
      POSTGRES_PASSWORD: puzzlehub_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: puzzlehub
      MINIO_ROOT_PASSWORD: puzzlehub_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
  minio-data:
