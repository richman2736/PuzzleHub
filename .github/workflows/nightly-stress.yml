name: Nightly Sudoku Stress

on:
  schedule:
    # 03:17 UTC daily. Off the hour to avoid GitHub's peak-of-hour scheduling lag.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seedsPerDifficulty:
        description: "Seeds generated per difficulty"
        required: false
        default: "1000"

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v3
        with:
          bun-version: "1.3.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generator stress
        run: bun run test:stress
        env:
          STRESS_SEEDS_PER_DIFFICULTY: ${{ github.event.inputs.seedsPerDifficulty || '1000' }}
